name: Code Quality Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check file sizes
        run: |
          echo "📊 Checking for large files..."
          find src -type f -size +100k -exec ls -lh {} \; | awk '{print $9 ": " $5}' || echo "No large files found"

      - name: Count lines of code
        run: |
          echo "📈 Lines of Code Statistics:"
          echo "JavaScript/TypeScript files:"
          find src \( -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" \) | xargs wc -l | tail -1
          echo ""
          echo "Total files:"
          find src -type f | wc -l

      - name: Check for TODO comments
        run: |
          echo "📝 TODO Comments Found:"
          grep -r "TODO\|FIXME\|HACK\|XXX" src/ --exclude-dir=node_modules || echo "No TODO comments found"

      - name: Check for hardcoded secrets
        run: |
          echo "🔒 Checking for potential hardcoded secrets..."
          if grep -rEi "api_key|apiKey|password|secret|token" src/ --exclude-dir=node_modules | grep -v "// " | grep -v "placeholder"; then
            echo "⚠️ Warning: Potential hardcoded secrets found"
            echo "Please review and use environment variables instead"
          else
            echo "✅ No obvious hardcoded secrets found"
          fi

      - name: Check import statements
        run: |
          echo "📦 Checking for unused imports..."
          echo "Consider adding eslint-plugin-unused-imports"

      - name: Run Type Check
        run: |
          bunx tsc --noEmit || echo "No TypeScript config found, skipping..."

      - name: Generate summary
        run: |
          echo "## Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code quality checks completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Total JS/TS files: $(find src \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Total lines of code: $(find src \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) | xargs wc -l | tail -1 | awk '{print $1}')" >> $GITHUB_STEP_SUMMARY