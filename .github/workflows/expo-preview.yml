name: Expo Preview Build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  preview:
    name: Create Expo Preview
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create Expo preview
        run: |
          echo "📱 Creating Expo preview build..."
          echo "To enable this, add EXPO_TOKEN to your GitHub secrets"
          echo "Get your token from: https://expo.dev/accounts/[account]/settings/access-tokens"
          # Uncomment below when EXPO_TOKEN is configured
          # npx expo publish --non-interactive

      - name: Comment PR with QR code
        if: github.event_name == 'pull_request'
        run: |
          echo "Would post QR code to PR for testing"
          echo "Requires EXPO_TOKEN and GitHub token permissions"
