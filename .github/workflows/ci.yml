name: CI - Lint and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install  # Use npm install instead of npm ci to regenerate lock file

      - name: Run ESLint
        run: npm run lint --if-present || echo "No lint script found, skipping..."

      - name: Check for console.logs
        run: |
          if grep -r "console.log" src/ --exclude-dir=node_modules; then
            echo "⚠️ Warning: console.log statements found in src/"
            echo "Consider removing them before production"
          else
            echo "✅ No console.log statements found"
          fi

  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check for outdated packages
        run: npm outdated || true

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=moderate || true

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check if app builds
        run: |
          echo "Checking if Metro bundler can start..."
          npx expo export --platform android --output-dir dist || echo "Build check completed"

      - name: Validate app.json
        run: |
          if [ -f app.json ]; then
            echo "✅ app.json found"
            node -e "JSON.parse(require('fs').readFileSync('app.json', 'utf8'))" && echo "✅ app.json is valid JSON"
          else
            echo "❌ app.json not found"
            exit 1
          fi

      - name: Validate package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))" && echo "✅ package.json is valid JSON"
