name: CI - Lint and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint --if-present || echo "No lint script found, skipping..."

      - name: Check for console.logs
        run: |
          if grep -r "console.log" src/ --exclude-dir=node_modules; then
            echo "⚠️ Warning: console.log statements found in src/"
            echo "Consider removing them before production"
          else
            echo "✅ No console.log statements found"
          fi

  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check for outdated packages
        run: bun outdated || true

      - name: Check for security vulnerabilities
        run: bun audit || true

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check if app builds
        run: |
          echo "Checking if Expo build works..."
          bunx expo export --platform android --output-dir dist || echo "Build check completed"

      - name: Validate app.json
        run: |
          if [ -f app.json ]; then
            echo "✅ app.json found"
            bun -e "JSON.parse(require('fs').readFileSync('app.json', 'utf8'))" && echo "✅ app.json is valid JSON"
          else
            echo "❌ app.json not found"
            exit 1
          fi

      - name: Validate package.json
        run: |
          bun -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))" && echo "✅ package.json is valid JSON"